<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" font-family="Arial, 'Helvetica Neue', 'DejaVu Sans', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="470" fill="#FFFFFF"/>
  <text x="40" y="42" font-size="21" font-weight="700" fill="#0F172A">Five services, one authentication fabric</text>
  <text x="40" y="68" font-size="13" fill="#64748B">RADIUS authenticates WiFi clients against PostgreSQL; Keycloak issues SAML by federating the LDAP directory.</text>

  <!-- edges -->
  <g>
    <path d="M232,162 H398" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M572,162 H738" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M232,332 H398" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M572,332 H738" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11" fill="#475569" text-anchor="middle">
    <rect x="270" y="140" width="92" height="15" fill="#FFFFFF"/><text x="316" y="151">RADIUS · RadSec</text>
    <rect x="612" y="140" width="90" height="15" fill="#FFFFFF"/><text x="657" y="151">user lookup + logs</text>
    <rect x="288" y="310" width="56" height="15" fill="#FFFFFF"/><text x="316" y="321">SAML 2.0</text>
    <rect x="610" y="310" width="94" height="15" fill="#FFFFFF"/><text x="657" y="321">user federation</text>
  </g>

  <!-- actors -->
  <g>
    <rect x="40" y="130" width="192" height="64" rx="10" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="136" y="159" text-anchor="middle" font-size="15" font-weight="600" fill="#5B21B6">WiFi AP / 802.1X</text>
    <text x="136" y="178" text-anchor="middle" font-size="11" fill="#7C3AED">supplicant</text>
    <rect x="40" y="300" width="192" height="64" rx="10" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="136" y="329" text-anchor="middle" font-size="15" font-weight="600" fill="#5B21B6">Web application</text>
    <text x="136" y="348" text-anchor="middle" font-size="11" fill="#7C3AED">SAML service provider</text>
  </g>

  <!-- services -->
  <g>
    <rect x="400" y="130" width="172" height="64" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="486" y="159" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">freeradius</text>
    <text x="486" y="178" text-anchor="middle" font-size="11" fill="#2563EB">EAP-TLS / TTLS / PEAP</text>
    <rect x="400" y="300" width="172" height="64" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="486" y="329" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">keycloak</text>
    <text x="486" y="348" text-anchor="middle" font-size="11" fill="#2563EB">SAML 2.0 IdP</text>
  </g>

  <!-- backends -->
  <path d="M740,150 V210 A78,15 0 0 0 896,210 V150" fill="#A7F3D0" stroke="#10B981" stroke-width="2"/>
  <ellipse cx="818" cy="150" rx="78" ry="15" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="818" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">PostgreSQL</text>
  <text x="818" y="203" text-anchor="middle" font-size="11" fill="#047857">users · auth · accounting</text>

  <rect x="732" y="300" width="172" height="64" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="818" y="329" text-anchor="middle" font-size="16" font-weight="700" fill="#065F46">OpenLDAP</text>
  <text x="818" y="348" text-anchor="middle" font-size="11" fill="#047857">directory · AD-compatible</text>

  <!-- mail (standalone, receive-only) -->
  <rect x="390" y="408" width="200" height="46" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="490" y="429" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">mail · receive-only</text>
  <text x="490" y="445" text-anchor="middle" font-size="10.5" fill="#64748B">credential delivery for test onboarding</text>
</svg>
