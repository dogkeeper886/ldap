<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" font-family="Arial, 'Helvetica Neue', 'DejaVu Sans', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="430" fill="#FFFFFF"/>
  <text x="40" y="42" font-size="21" font-weight="700" fill="#0F172A">One certificate, every service</text>
  <text x="40" y="68" font-size="13" fill="#64748B">certbot acquires a multi-domain SAN cert via Cloudflare DNS-01; each service copies it into its build context.</text>

  <!-- edges (drawn first, under nodes) -->
  <path d="M200,178 C250,178 252,212 300,212" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M200,318 C250,318 252,268 300,268" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M460,240 C505,240 515,243 558,243" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M700,232 C748,205 758,120 798,120" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M700,240 C748,222 758,200 798,200" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M700,250 C748,262 758,280 798,280" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M700,258 C748,300 758,360 798,360" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- edge labels -->
  <g font-size="11" fill="#475569" text-anchor="middle">
    <rect x="222" y="156" width="64" height="15" fill="#FFFFFF"/><text x="254" y="167">issues cert</text>
    <rect x="486" y="222" width="44" height="15" fill="#FFFFFF"/><text x="508" y="233">stores</text>
    <rect x="660" y="148" width="112" height="16" fill="#FFFFFF"/><text x="716" y="160" font-weight="600">make copy-certs</text>
    <rect x="676" y="164" width="80" height="14" fill="#FFFFFF"/><text x="716" y="175">docker cp</text>
  </g>

  <!-- external sources -->
  <g>
    <rect x="40" y="150" width="160" height="56" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="120" y="183" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">Let's Encrypt</text>
    <rect x="40" y="290" width="160" height="56" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="120" y="314" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">Cloudflare DNS</text>
    <text x="120" y="332" text-anchor="middle" font-size="11" fill="#64748B">DNS-01 challenge</text>
  </g>

  <!-- certbot -->
  <rect x="300" y="198" width="160" height="84" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="380" y="236" text-anchor="middle" font-size="17" font-weight="700" fill="#92400E">certbot</text>
  <text x="380" y="256" text-anchor="middle" font-size="11" fill="#B45309">acquire + auto-renew</text>

  <!-- cert volume (cylinder) -->
  <path d="M560,205 V283 A70,15 0 0 0 700,283 V205" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>
  <ellipse cx="630" cy="205" rx="70" ry="15" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="630" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">SAN cert</text>
  <text x="630" y="262" text-anchor="middle" font-size="11" fill="#B45309">Docker volume</text>

  <!-- services -->
  <g>
    <rect x="798" y="92"  width="160" height="56" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="878" y="125" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A8A">ldap</text>
    <rect x="798" y="172" width="160" height="56" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="878" y="205" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A8A">freeradius</text>
    <rect x="798" y="252" width="160" height="56" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="878" y="285" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A8A">keycloak</text>
    <rect x="798" y="332" width="160" height="56" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="878" y="365" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A8A">mail</text>
  </g>
</svg>
