<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" font-family="Arial, 'Helvetica Neue', 'DejaVu Sans', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="380" fill="#FFFFFF"/>
  <text x="40" y="42" font-size="21" font-weight="700" fill="#0F172A">MCP access to the RADIUS database</text>
  <text x="40" y="68" font-size="13" fill="#64748B">Bearer-token HTTPS. 9 query tools (read) + 5 user-management tools, against the FreeRADIUS PostgreSQL.</text>

  <!-- edges -->
  <path d="M238,168 H398" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M606,168 C660,168 706,168 760,168" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M842,272 V232" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g font-size="11" fill="#475569" text-anchor="middle">
    <rect x="250" y="146" width="134" height="15" fill="#FFFFFF"/><text x="317" y="157">HTTPS + Bearer token</text>
    <rect x="640" y="146" width="120" height="15" fill="#FFFFFF"/><text x="700" y="157">SQL: query + user mgmt</text>
    <rect x="700" y="244" width="116" height="15" fill="#FFFFFF"/><text x="758" y="255">writes auth + accounting</text>
  </g>

  <!-- mcp client -->
  <rect x="40" y="132" width="198" height="72" rx="10" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="139" y="163" text-anchor="middle" font-size="15" font-weight="600" fill="#5B21B6">MCP client (Claude)</text>
  <text x="139" y="183" text-anchor="middle" font-size="11" fill="#7C3AED">Authorization: Bearer …</text>

  <!-- mcp server -->
  <rect x="398" y="120" width="208" height="96" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="502" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">mcp-radius-sql</text>
  <text x="502" y="171" text-anchor="middle" font-size="11" fill="#2563EB">Express + TLS · :3443 → :3000</text>
  <text x="502" y="189" text-anchor="middle" font-size="11" fill="#2563EB">9 query · 5 user tools</text>
  <text x="502" y="207" text-anchor="middle" font-size="11" fill="#2563EB">timing-safe token check</text>

  <!-- postgresql -->
  <path d="M762,150 V196 A80,15 0 0 0 922,196 V150" fill="#A7F3D0" stroke="#10B981" stroke-width="2"/>
  <ellipse cx="842" cy="150" rx="80" ry="15" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="842" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">PostgreSQL</text>
  <text x="842" y="197" text-anchor="middle" font-size="10.5" fill="#047857">radcheck · radacct · radpostauth</text>

  <!-- freeradius -->
  <rect x="754" y="274" width="176" height="58" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="842" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A8A">freeradius</text>
  <text x="842" y="319" text-anchor="middle" font-size="11" fill="#2563EB">auth + accounting</text>
</svg>
