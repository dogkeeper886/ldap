<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" font-family="Arial, 'Helvetica Neue', 'DejaVu Sans', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="460" fill="#FFFFFF"/>
  <text x="40" y="42" font-size="21" font-weight="700" fill="#0F172A">How a client authenticates</text>
  <text x="40" y="68" font-size="13" fill="#64748B">EAP over RADIUS (1812/udp) → SQL user lookup; accounting on 1813/udp; RadSec peers over TLS on 2083/tcp.</text>

  <!-- certbot feeding cert -->
  <rect x="395" y="104" width="200" height="44" rx="9" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="495" y="131" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400E">certbot → server cert</text>
  <path d="M495,148 V176" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- edges -->
  <path d="M232,250 H392" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M598,222 C660,222 700,210 738,205" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M598,270 C660,270 700,290 738,300" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g font-size="11" fill="#475569" text-anchor="middle">
    <rect x="270" y="228" width="86" height="15" fill="#FFFFFF"/><text x="313" y="239">1812/udp · EAP</text>
    <rect x="624" y="196" width="118" height="15" fill="#FFFFFF"/><text x="683" y="207">authorize → radcheck</text>
    <rect x="620" y="300" width="128" height="15" fill="#FFFFFF"/><text x="684" y="311">1813/udp → radacct</text>
  </g>

  <!-- supplicant -->
  <rect x="40" y="218" width="192" height="64" rx="10" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="136" y="247" text-anchor="middle" font-size="15" font-weight="600" fill="#5B21B6">WiFi supplicant</text>
  <text x="136" y="266" text-anchor="middle" font-size="11" fill="#7C3AED">EAP-TLS / TTLS / PEAP</text>

  <!-- freeradius -->
  <rect x="392" y="178" width="206" height="134" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="495" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">FreeRADIUS 3.x</text>
  <text x="495" y="228" text-anchor="middle" font-size="11" fill="#2563EB">server cert + client CA (EAP-TLS)</text>
  <text x="495" y="246" text-anchor="middle" font-size="11" fill="#2563EB">EAP-TLS / TTLS / PEAP / MSCHAPv2</text>
  <text x="495" y="264" text-anchor="middle" font-size="11" fill="#2563EB">SQL module (rlm_sql)</text>
  <text x="495" y="288" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E40AF">RadSec :2083/tcp</text>

  <!-- postgresql -->
  <path d="M740,180 V300 A82,16 0 0 0 904,300 V180" fill="#A7F3D0" stroke="#10B981" stroke-width="2"/>
  <ellipse cx="822" cy="180" rx="82" ry="16" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="822" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">PostgreSQL</text>
  <g font-size="11" fill="#047857" text-anchor="middle">
    <text x="822" y="230">radcheck · radusergroup</text>
    <text x="822" y="248">radgroupreply  (auth)</text>
    <text x="822" y="272">radacct · radpostauth</text>
    <text x="822" y="290">(accounting + log)</text>
  </g>
</svg>
